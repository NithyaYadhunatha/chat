# Full stack on one machine: MongoDB + API + web.
#   SECRET_KEY=$(openssl rand -hex 32) docker compose up --build
# Then open http://localhost:3000.
#
# This runs over plain HTTP for local use (ENV=development). For a real
# deployment put it behind TLS, set ENV=production, https ALLOWED_ORIGINS and a
# wss:// NEXT_PUBLIC_WS_URL.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ENV: development
      MONGODB_URL: mongodb://mongo:27017
      DB_NAME: pingpong
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (openssl rand -hex 32)}
      ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRUST_PROXY: "true"
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo-data:
